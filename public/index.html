<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invictus GO — Аудит продаж</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#0f0f1a; color:#e0e0e0; min-height:100vh; }
.header { background:linear-gradient(135deg,#1a1a2e,#16213e); padding:16px 28px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #2a2a4a; }
.logo { font-size:20px; font-weight:700; color:#fff; }
.logo span { color:#6c63ff; }
.dot { width:8px; height:8px; background:#00d4aa; border-radius:50%; display:inline-block; margin-right:6px; box-shadow:0 0 8px #00d4aa; animation:pulse 2s infinite; }
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.main { padding:20px 28px; max-width:1600px; margin:0 auto; }
.tabs { display:flex; gap:4px; background:#1a1a2e; padding:4px; border-radius:10px; border:1px solid #2a2a4a; margin-bottom:20px; width:fit-content; }
.tab { padding:9px 22px; border:none; border-radius:7px; cursor:pointer; font-size:13px; font-weight:600; background:transparent; color:#6060a0; transition:all .2s; }
.tab.active { background:#6c63ff; color:#fff; }
.controls { display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; align-items:center; }
.btn { padding:10px 20px; border:none; border-radius:9px; cursor:pointer; font-size:13px; font-weight:600; transition:all .2s; }
.btn-primary { background:linear-gradient(135deg,#6c63ff,#5a52d5); color:#fff; }
.btn-primary:hover { transform:translateY(-1px); box-shadow:0 6px 16px rgba(108,99,255,.4); }
.btn-success { background:linear-gradient(135deg,#00d4aa,#00b894); color:#fff; }
.btn-success:hover { transform:translateY(-1px); box-shadow:0 6px 16px rgba(0,212,170,.4); }
.btn-orange { background:linear-gradient(135deg,#ff9a3c,#ff6b00); color:#fff; }
.btn-orange:hover { transform:translateY(-1px); box-shadow:0 6px 16px rgba(255,107,0,.4); }
.btn:disabled { opacity:.5; cursor:not-allowed; transform:none!important; }
input[type="date"] { background:#1e1e35; border:1px solid #2a2a4a; color:#e0e0e0; padding:10px 14px; border-radius:9px; font-size:13px; }
.period-selector { display:flex; gap:3px; background:#1e1e35; padding:3px; border-radius:9px; border:1px solid #2a2a4a; }
.period-btn { padding:7px 16px; border:none; border-radius:6px; cursor:pointer; font-size:12px; font-weight:600; background:transparent; color:#a0a0c0; transition:all .2s; }
.period-btn.active { background:#6c63ff; color:#fff; }
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:12px; margin-bottom:20px; }
.stat-card { background:#1a1a2e; border:1px solid #2a2a4a; border-radius:12px; padding:16px; }
.stat-label { font-size:10px; color:#6060a0; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
.stat-value { font-size:26px; font-weight:700; color:#fff; }
.stat-sub { font-size:11px; color:#6060a0; margin-top:3px; }
.stat-card.green .stat-value { color:#00d4aa; }
.stat-card.yellow .stat-value { color:#ffd600; }
.stat-card.red .stat-value { color:#ff4d6d; }
.stat-card.purple .stat-value { color:#6c63ff; }
.stat-card.orange .stat-value { color:#ff9a3c; }
.table-wrap { overflow-x:auto; border-radius:12px; border:1px solid #2a2a4a; margin-bottom:20px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
thead tr { background:#1a1a2e; }
th { padding:12px 14px; text-align:left; font-size:11px; font-weight:700; color:#a0a0c0; text-transform:uppercase; letter-spacing:.8px; border-bottom:2px solid #6c63ff; white-space:nowrap; }
th.center,td.center { text-align:center; }
tbody tr { border-bottom:1px solid #1e1e35; transition:background .15s; }
tbody tr:hover { background:#1a1a2e; }
tbody tr:last-child { border-bottom:none; }
td { padding:11px 14px; color:#e0e0e0; vertical-align:middle; }
.manager-name { font-weight:700; color:#fff; font-size:14px; }
.score-cell { font-size:18px; font-weight:800; }
.score-high{color:#00d4aa}.score-mid{color:#ffd600}.score-low{color:#ff4d6d}
.result-badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; white-space:nowrap; }
.rb-green{background:#00d4aa1a;color:#00d4aa}.rb-red{background:#ff4d6d1a;color:#ff4d6d}.rb-yellow{background:#ffd6001a;color:#ffd600}
.conv-pct { font-size:13px; font-weight:700; color:#6c63ff; }
.error-tag { display:inline-block; background:#ff4d6d12; border:1px solid #ff4d6d2a; color:#ff8099; padding:2px 8px; border-radius:5px; font-size:11px; margin:2px 2px 2px 0; }
.str-tag { display:inline-block; background:#00d4aa12; border:1px solid #00d4aa2a; color:#00d4aa; padding:2px 8px; border-radius:5px; font-size:11px; margin:2px 2px 2px 0; }
.rec-text { font-size:12px; color:#a0a0c0; line-height:1.5; }
.progress-bar { background:#0f0f1a; border-radius:4px; height:5px; margin-top:5px; overflow:hidden; min-width:60px; }
.progress-fill { height:100%; border-radius:4px; background:linear-gradient(90deg,#6c63ff,#00d4aa); }
.card { background:#1a1a2e; border:1px solid #2a2a4a; border-radius:12px; padding:18px; margin-bottom:14px; }
.card-title { font-size:14px; font-weight:600; color:#fff; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; }
.conv-row { padding:12px; border-radius:8px; background:#0f0f1a; margin-bottom:7px; display:flex; justify-content:space-between; align-items:center; }
.conv-name { font-weight:600; font-size:13px; }
.conv-meta { font-size:11px; color:#6060a0; margin-top:2px; }
.tag { padding:3px 9px; border-radius:20px; font-size:11px; font-weight:500; }
.tag-green{background:#00d4aa1a;color:#00d4aa}.tag-red{background:#ff4d6d1a;color:#ff4d6d}
.tag-yellow{background:#ffd6001a;color:#ffd600}.tag-blue{background:#6c63ff1a;color:#6c63ff}
.tag-orange{background:#ff9a3c1a;color:#ff9a3c}
.loading { text-align:center; padding:50px; color:#6060a0; }
.spinner { width:32px; height:32px; border:3px solid #2a2a4a; border-top-color:#6c63ff; border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 12px; }
@keyframes spin{to{transform:rotate(360deg)}}
.empty { text-align:center; padding:40px; color:#6060a0; font-size:14px; line-height:1.8; }
.alert { padding:11px 15px; border-radius:9px; margin-bottom:14px; font-size:13px; }
.alert-info{background:#6c63ff15;border:1px solid #6c63ff33;color:#a0a0ff}
.alert-success{background:#00d4aa15;border:1px solid #00d4aa33;color:#00d4aa}
.alert-warning{background:#ffd60015;border:1px solid #ffd60033;color:#ffd600}
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media(max-width:900px){.grid-2{grid-template-columns:1fr}}
.webhook-url { background:#0f0f1a; padding:6px 12px; border-radius:6px; font-family:monospace; color:#6c63ff; margin-top:6px; font-size:12px; word-break:break-all; }
.direction-in { color:#00d4aa; font-size:11px; }
.direction-out { color:#6c63ff; font-size:11px; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">INVICTUS <span>GO</span> — Аудит</div>
  <div style="font-size:12px;color:#6060a0"><span class="dot"></span>Live · <span id="statsLine">загрузка...</span></div>
</div>
<div class="main">
  <div class="tabs">
    <button class="tab active" onclick="showTab('audit',this)">📊 Аудит</button>
    <button class="tab" onclick="showTab('managers',this)">👥 Менеджеры</button>
    <button class="tab" onclick="showTab('settings',this)">⚙️ Настройки</button>
  </div>

  <!-- АУДИТ -->
  <div id="tab-audit">
    <div class="controls">
      <div class="period-selector">
        <button class="period-btn active" id="btn-day" onclick="setPeriod('day')">День</button>
        <button class="period-btn" id="btn-month" onclick="setPeriod('month')">Месяц</button>
      </div>
      <input type="date" id="dateInput">
      <button class="btn btn-primary" onclick="runAudit()" id="auditBtn">🔍 Аудит</button>
      <button class="btn btn-orange" onclick="syncCalls()" id="syncBtn">📞 Синхр. звонки</button>
      <button class="btn btn-success" onclick="analyzeAll()" id="analyzeBtn">⚡ Анализировать всё</button>
      <button class="btn" style="background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff" onclick="downloadPDF()" id="pdfBtn">📄 Скачать PDF отчёт</button>
    </div>
    <div id="alertBox" style="display:none"></div>
    <div class="loading" id="auditLoading" style="display:none"><div class="spinner"></div>Анализируем...</div>
    <div id="auditResults" style="display:none">
      <div class="stats-grid" id="statsGrid"></div>
      <div class="grid-2">
        <div class="card">
          <div class="card-title"><span>📞 Звонки</span><span id="callsCount" style="font-size:11px;color:#6060a0"></span></div>
          <div id="callsList"></div>
        </div>
        <div class="card">
          <div class="card-title"><span>💬 Переписки WhatsApp</span><span id="convsCount" style="font-size:11px;color:#6060a0"></span></div>
          <div id="convsList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- МЕНЕДЖЕРЫ -->
  <div id="tab-managers" style="display:none">
    <div class="controls">
      <button class="btn btn-primary" onclick="loadManagers()" id="loadBtn">📊 Загрузить отчёт</button>
      <button class="btn btn-success" onclick="analyzeAll()" id="analyzeBtn2">⚡ Анализировать переписки</button>
    </div>
    <div class="loading" id="mgrLoading" style="display:none"><div class="spinner"></div>Загружаем...</div>
    <div id="mgrResults"></div>
  </div>

  <!-- НАСТРОЙКИ -->
  <div id="tab-settings" style="display:none">
    <div class="card">
      <div class="card-title">📡 Wazzup вебхук</div>
      <div class="webhook-url" id="wazzupUrl"></div>
    </div>
    <div class="card">
      <div class="card-title">📞 Записи звонков</div>
      <div style="font-size:13px;color:#a0a0c0;margin-bottom:8px">Источник: <a href="https://op.entryx.io/amo/monitor/" target="_blank" style="color:#6c63ff">op.entryx.io/amo/monitor/</a></div>
      <div style="font-size:12px;color:#6060a0">Транскрипция: Groq Whisper Large V3 (русский/казахский)<br>Анализ: Claude Sonnet</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const base = location.origin;
document.getElementById('wazzupUrl').textContent = base + '/webhook/wazzup';
document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
let period = 'day';

// Загружаем статистику в хедер
async function loadStats() {
  try {
    const d = await fetch('/api/stats').then(r=>r.json());
    document.getElementById('statsLine').textContent =
      `Переписок: ${d.convsCount} | Звонков: ${d.callsCount} (транскриб: ${d.withTranscript||0})`;
  } catch(e) {}
}
loadStats();

function showTab(name, btn) {
  document.querySelectorAll('[id^="tab-"]').forEach(el=>el.style.display='none');
  document.getElementById('tab-'+name).style.display='block';
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function setPeriod(p) {
  period=p;
  document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+p).classList.add('active');
}
function scoreClass(s){return s>=7?'score-high':s>=4?'score-mid':'score-low';}
function tagClass(r){return{продал:'tag-green','не продал':'tag-red',перезвонит:'tag-yellow',думает:'tag-yellow'}[r]||'tag-blue';}
function showAlert(msg,type='info'){
  const el=document.getElementById('alertBox');
  el.innerHTML=`<div class="alert alert-${type}">${msg}</div>`;
  el.style.display='block';
  setTimeout(()=>el.style.display='none',6000);
}

async function downloadPDF() {
  const btn = document.getElementById('pdfBtn');
  btn.disabled = true; btn.textContent = '⏳ Генерация...';
  try {
    const dateFrom = document.getElementById('dateInput').value;
    // Период: если день — один день, если месяц — весь месяц
    let dateTo = dateFrom;
    if (period === 'month') {
      const d = new Date(dateFrom);
      dateTo = new Date(d.getFullYear(), d.getMonth()+1, 0).toISOString().split('T')[0];
    }
    const r = await fetch(`/api/pdf-report-data?date_from=${dateFrom}&date_to=${dateTo}`);
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    generatePDF(d);
  } catch(e) { showAlert('Ошибка PDF: '+e.message); }
  finally { btn.disabled=false; btn.textContent='📄 Скачать PDF отчёт'; }
}

function generatePDF(d) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const W = 210, M = 15, CW = W - M*2;
  let y = 0;

  const addPage = () => { doc.addPage(); y = 20; };
  const checkY = (need=20) => { if (y + need > 270) addPage(); };

  // Цвета
  const navy  = [30, 58, 95];
  const green = [0, 180, 140];
  const red   = [220, 60, 60];
  const gold  = [200, 150, 0];
  const gray  = [100, 100, 120];
  const lightgray = [240, 242, 248];

  // ── ШАПКА ──────────────────────────────────────────────────────────────
  doc.setFillColor(...navy);
  doc.rect(0, 0, W, 40, 'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(24); doc.setFont('helvetica','bold');
  doc.text('INVICTUS GO', M, 18);
  doc.setFontSize(13); doc.setFont('helvetica','normal');
  doc.text('Аудит отдела продаж', M, 27);
  doc.setFontSize(10); doc.setTextColor(180,200,230);
  doc.text(`Период: ${d.period.from} — ${d.period.to}`, M, 35);
  doc.text(`Сформировано: ${d.generatedAt}`, W-M, 35, {align:'right'});
  y = 52;

  // ── KPI КАРТОЧКИ ────────────────────────────────────────────────────────
  doc.setTextColor(...navy);
  doc.setFontSize(13); doc.setFont('helvetica','bold');
  doc.text('Сводные показатели', M, y); y += 7;

  const kpis = [
    { label: 'Звонков всего',      value: d.calls.total,    sub: `проан: ${d.calls.analyzed}`,   color: navy },
    { label: 'Переписок всего',    value: d.convs.total,    sub: `проан: ${d.convs.analyzed}`,   color: [46,95,159] },
    { label: 'Ср. рейтинг команды', value: `${d.team.avgScore}/10`, sub: 'из 10',               color: d.team.avgScore>=7?green:d.team.avgScore>=5?gold:red },
    { label: 'Конверсия',          value: `${d.team.conv}%`, sub: `продано: ${d.team.sold}`,    color: d.team.conv>=40?green:d.team.conv>=20?gold:red },
  ];
  const cw = CW/4 - 2;
  kpis.forEach((k, i) => {
    const x = M + i*(cw+2.7);
    doc.setFillColor(...lightgray);
    doc.roundedRect(x, y, cw, 22, 2, 2, 'F');
    doc.setDrawColor(...k.color);
    doc.setLineWidth(0.8);
    doc.line(x, y, x, y+22);
    doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(...gray);
    doc.text(k.label, x+3, y+6);
    doc.setFontSize(18); doc.setFont('helvetica','bold'); doc.setTextColor(...k.color);
    doc.text(String(k.value), x+3, y+16);
    doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(...gray);
    doc.text(k.sub, x+3, y+21);
  });
  y += 30;

  // Итоги по результатам
  doc.setFillColor(...lightgray);
  doc.roundedRect(M, y, CW, 14, 2, 2, 'F');
  const cols3 = [
    { label: '✅ Продано',       value: d.team.sold,    color: green },
    { label: '❌ Не продано',    value: d.team.lost,    color: red },
    { label: '⏳ В процессе',   value: d.team.pending, color: gold },
  ];
  cols3.forEach((c, i) => {
    const x = M + i*(CW/3);
    doc.setFontSize(8); doc.setTextColor(...gray); doc.setFont('helvetica','normal');
    doc.text(c.label, x+5, y+5);
    doc.setFontSize(16); doc.setFont('helvetica','bold'); doc.setTextColor(...c.color);
    doc.text(String(c.value), x+5, y+12);
  });
  y += 22;

  // ── ТАБЛИЦА МЕНЕДЖЕРОВ ──────────────────────────────────────────────────
  checkY(30);
  doc.setFontSize(13); doc.setFont('helvetica','bold'); doc.setTextColor(...navy);
  doc.text('Рейтинг менеджеров', M, y); y += 7;

  // Заголовок таблицы
  const cols = [
    {label:'#',       w:8},
    {label:'Менеджер',w:32},
    {label:'Рейтинг', w:20},
    {label:'Звонков', w:20},
    {label:'Перепис.',w:20},
    {label:'Продал',  w:18},
    {label:'Конв.',   w:16},
    {label:'Ошибка #1',w:46},
  ];
  let cx = M;
  doc.setFillColor(...navy);
  doc.rect(M, y, CW, 8, 'F');
  doc.setFontSize(7.5); doc.setFont('helvetica','bold'); doc.setTextColor(255,255,255);
  cols.forEach(c => {
    doc.text(c.label, cx+1.5, y+5.5);
    cx += c.w;
  });
  y += 8;

  // Строки менеджеров
  d.managers.forEach((m, i) => {
    checkY(10);
    const rowH = 9;
    if (i%2===0) { doc.setFillColor(...lightgray); doc.rect(M, y, CW, rowH, 'F'); }
    cx = M;
    const scoreColor = m.avgScore>=7?green:m.avgScore>=5?gold:red;
    const convColor  = m.conv>=40?green:m.conv>=20?gold:red;
    const vals = [
      {v:String(i+1),         color:gray,       bold:false},
      {v:m.name||'—',         color:navy,       bold:true},
      {v:`${m.avgScore}/10`,  color:scoreColor, bold:true},
      {v:String(m.calls),     color:navy,       bold:false},
      {v:String(m.convs),     color:navy,       bold:false},
      {v:String(m.sold),      color:green,      bold:true},
      {v:`${m.conv}%`,        color:convColor,  bold:true},
      {v:(m.topErrors[0]||'—').slice(0,35), color:red, bold:false},
    ];
    vals.forEach((v, j) => {
      doc.setFontSize(j===1?8:8);
      doc.setFont('helvetica', v.bold?'bold':'normal');
      doc.setTextColor(...v.color);
      doc.text(String(v.v), cx+1.5, y+6);
      cx += cols[j].w;
    });
    y += rowH;
  });
  y += 8;

  // ── ДЕТАЛИ ПО МЕНЕДЖЕРАМ ───────────────────────────────────────────────
  if (d.managers.length > 0) {
    addPage();
    doc.setFontSize(13); doc.setFont('helvetica','bold'); doc.setTextColor(...navy);
    doc.text('Детальный анализ менеджеров', M, y); y += 10;

    d.managers.forEach((m, i) => {
      checkY(45);
      // Карточка менеджера
      const scoreColor = m.avgScore>=7?green:m.avgScore>=5?gold:red;
      doc.setFillColor(...lightgray);
      doc.roundedRect(M, y, CW, 40, 2, 2, 'F');
      doc.setDrawColor(...scoreColor); doc.setLineWidth(1.5);
      doc.line(M, y, M, y+40);

      // Имя и рейтинг
      doc.setFontSize(12); doc.setFont('helvetica','bold'); doc.setTextColor(...navy);
      doc.text(`${i+1}. ${m.name}`, M+4, y+8);
      doc.setFontSize(18); doc.setFont('helvetica','bold'); doc.setTextColor(...scoreColor);
      doc.text(`${m.avgScore}/10`, W-M-20, y+9);

      // Мини-статистика
      doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(...gray);
      doc.text(`Звонков: ${m.calls}  |  Переписок: ${m.convs}  |  Продано: ${m.sold}  |  Конверсия: ${m.conv}%`, M+4, y+15);

      // Ошибки
      doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...red);
      doc.text('Ошибки:', M+4, y+22);
      doc.setFont('helvetica','normal'); doc.setTextColor(100,30,30);
      const errText = m.topErrors.slice(0,2).join('  •  ') || '—';
      doc.text(errText.slice(0,90), M+20, y+22);

      // Сильные стороны
      doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...green);
      doc.text('Сильные:', M+4, y+29);
      doc.setFont('helvetica','normal'); doc.setTextColor(0,80,60);
      const strText = m.topStrengths.slice(0,2).join('  •  ') || '—';
      doc.text(strText.slice(0,90), M+22, y+29);

      y += 46;
    });
  }

  // ── ФУТЕР ──────────────────────────────────────────────────────────────
  const pageCount = doc.getNumberOfPages();
  for (let i=1; i<=pageCount; i++) {
    doc.setPage(i);
    doc.setFillColor(...navy);
    doc.rect(0, 287, W, 10, 'F');
    doc.setFontSize(7); doc.setTextColor(180,200,230);

async function runAudit() {
  const date=document.getElementById('dateInput').value;
  document.getElementById('auditBtn').disabled=true;
  document.getElementById('auditLoading').style.display='block';
  document.getElementById('auditResults').style.display='none';
  try {
    const r=await fetch(`/api/audit?period=${period}&date=${date}`);

    if(d.error) throw new Error(d.error);
    renderAudit(d);
  } catch(e){showAlert('Ошибка: '+e.message);}
  finally{document.getElementById('auditBtn').disabled=false;document.getElementById('auditLoading').style.display='none';}
}

    <div class="stat-card orange"><div class="stat-label">Звонков</div><div class="stat-value">${d.calls.total}</div><div class="stat-sub">транскриб: ${d.calls.withTranscript||0} · ан: ${d.calls.analyzed}</div></div>
    <div class="stat-card ${d.calls.avgScore>=7?'green':d.calls.avgScore>=4?'yellow':'red'}"><div class="stat-label">Ср. балл звонков</div><div class="stat-value">${d.calls.avgScore||'—'}</div><div class="stat-sub">из 10</div></div>
    <div class="stat-card green"><div class="stat-label">Переписок</div><div class="stat-value">${d.conversations.total}</div><div class="stat-sub">проан: ${d.conversations.analyzed}</div></div>

  document.getElementById('callsCount').textContent=d.calls.total+' звонков';

        <div>
          <div class="conv-name">${c.manager||'Определяется...'}</div>
          <div class="conv-meta">
            <span class="${c.direction==='in'?'direction-in':'direction-out'}">${c.direction==='in'?'↙ входящий':'↗ исходящий'}</span>
            · ${c.phone} · ${c.date}
          </div>
          ${c.hasTranscript?'<div style="font-size:11px;color:#6060a0;margin-top:2px">✓ транскрибирован</div>':'<div style="font-size:11px;color:#ff9a3c;margin-top:2px">⏳ ожидает транскрипции</div>'}
        </div>
        <div style="text-align:right">${c.analysis
          ?`<span class="tag ${tagClass(c.analysis.result)}">${c.analysis.result}</span><br><small style="color:#6060a0">⭐${c.analysis.score}/10</small>`
          :'<span style="color:#6060a0;font-size:11px">—</span>'}</div>
      </div>`).join('');

  document.getElementById('convsCount').textContent=d.conversations.total+' чатов';
  document.getElementById('convsList').innerHTML = !d.recentConversations?.length
    ? '<div class="empty">💬 Нет переписок за период</div>'
    : d.recentConversations.map(c=>{
        let html='<span style="color:#6060a0;font-size:11px">не проан.</span>';
        if(c.analysis){try{const a=JSON.parse(c.analysis);html=`<span class="tag ${tagClass(a.result)}">${a.result}</span><br><small style="color:#6060a0">⭐${a.score}/10</small>`}catch(e){}}
        return `<div class="conv-row">

          <div style="text-align:right">${html}</div>

async function loadManagers() {
  document.getElementById('loadBtn').disabled=true;
  document.getElementById('mgrLoading').style.display='block';
  document.getElementById('mgrResults').innerHTML='';
  try {
    const r=await fetch('/api/manager-report');

}

function renderManagers(d) {
  const el=document.getElementById('mgrResults');
  if(!d.managers?.length){
    el.innerHTML='<div class="empty" style="padding:60px">👥 Нет данных.<br><br>1. Нажмите «📞 Синхр. звонки» на вкладке Аудит<br>2. Подождите 5-10 минут (транскрипция)<br>3. Нажмите «⚡ Анализировать переписки»<br>4. Вернитесь сюда</div>';
    return;
  }
  const avgAll = d.managers.length?(d.managers.reduce((s,m)=>s+m.avgScore,0)/d.managers.length).toFixed(1):'—';
  const totalSold = d.managers.reduce((s,m)=>s+m.results.sold,0);
  const totalAll = d.managers.reduce((s,m)=>s+m.totalInteractions,0);

  el.innerHTML=`
    <div class="stats-grid" style="margin-bottom:16px">
      <div class="stat-card purple"><div class="stat-label">Менеджеров</div><div class="stat-value">${d.managers.length}</div></div>
      <div class="stat-card"><div class="stat-label">Переписок</div><div class="stat-value">${d.totalConvs}</div></div>
      <div class="stat-card orange"><div class="stat-label">Звонков</div><div class="stat-value">${d.totalCalls}</div></div>
      <div class="stat-card ${avgAll>=7?'green':avgAll>=4?'yellow':'red'}"><div class="stat-label">Ср. рейтинг</div><div class="stat-value">${avgAll}</div></div>
      <div class="stat-card green"><div class="stat-label">Общая конверсия</div><div class="stat-value">${totalAll?Math.round(totalSold/totalAll*100):0}%</div></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th class="center">#</th>
          <th>Менеджер</th>
          <th class="center">Рейтинг<br>0–10</th>
          <th class="center">Перепис.</th>
          <th class="center">Звонки</th>
          <th class="center">Продал</th>
          <th class="center">Не продал</th>
          <th class="center">В процессе</th>
          <th class="center">Конверсия</th>
          <th>Ошибка #1</th>
          <th>Ошибка #2</th>
          <th>Сильная сторона</th>
          <th>Рекомендация</th>
        </tr></thead>
        <tbody>${d.managers.map((m,i)=>{
          const all=m.results.sold+m.results.lost+m.results.pending;
          const conv=all?Math.round(m.results.sold/all*100):0;
          return `<tr>
            <td class="center" style="color:#6060a0;font-size:12px">${i+1}</td>
            <td><div class="manager-name">${m.name}</div><div style="font-size:11px;color:#6060a0">${m.convs} перепис. · ${m.calls} звонков</div></td>
            <td class="center">
              <div class="score-cell ${scoreClass(m.avgScore)}">${m.avgScore}</div>
              <div class="progress-bar"><div class="progress-fill" style="width:${m.avgScore*10}%"></div></div>
            </td>
            <td class="center">${m.convs}</td>
            <td class="center">${m.calls}</td>
            <td class="center"><span class="result-badge rb-green">✅ ${m.results.sold}</span></td>
            <td class="center"><span class="result-badge rb-red">❌ ${m.results.lost}</span></td>
            <td class="center"><span class="result-badge rb-yellow">⏳ ${m.results.pending}</span></td>
            <td class="center"><span class="conv-pct">${conv}%</span></td>
            <td><span class="error-tag">${m.topErrors[0]||'—'}</span></td>
            <td><span class="error-tag">${m.topErrors[1]||'—'}</span></td>

async function downloadPDF() {
  const btn = document.getElementById('pdfBtn');
  btn.disabled = true; btn.textContent = '⏳ Генерация...';

  try {
    const date = document.getElementById('dateInput').value;
    let dateFrom, dateTo;
    if (period === 'day') { dateFrom = date; dateTo = date; }
    else {
      const d = new Date(date);
      dateFrom = new Date(d.getFullYear(), d.getMonth(), 1).toISOString().split('T')[0];
      dateTo = new Date(d.getFullYear(), d.getMonth()+1, 0).toISOString().split('T')[0];
    }

    const r = await fetch(`/api/report-data?dateFrom=${dateFrom}&dateTo=${dateTo}`);
    const data = await r.json();
    if (data.error) throw new Error(data.error);

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const W = 210, M = 15, CW = W - M*2;
    let y = 20;

    const addPage = () => { doc.addPage(); y = 20; };
    const checkY = (need=20) => { if (y + need > 280) addPage(); };

    // ── ШАПКА ────────────────────────────────────────────────────────────────
    doc.setFillColor(30, 58, 95);
    doc.rect(0, 0, W, 36, 'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold'); doc.setFontSize(22);
    doc.text('INVICTUS GO', M, 15);
    doc.setFont('helvetica','normal'); doc.setFontSize(11);
    doc.text('Аудит отдела продаж', M, 23);
    doc.setFontSize(9);
    const periodLabel = dateFrom === dateTo ? dateFrom : `${dateFrom} — ${dateTo}`;
    doc.text(`Период: ${periodLabel}  |  Сформирован: ${data.generatedAt}`, M, 31);
    y = 46;

    // ── KPI БЛОК ─────────────────────────────────────────────────────────────
    const kpis = [
      { label: 'Звонков всего', value: data.calls.total, sub: `проан.: ${data.calls.analyzed}`, color: [255,107,53] },
      { label: 'Переписок всего', value: data.conversations.total, sub: `проан.: ${data.conversations.analyzed}`, color: [108,99,255] },
      { label: 'Ср. рейтинг команды', value: data.avgTeamScore + '/10', sub: 'по звонкам и перепискам', color: [0,212,170] },
      { label: 'Менеджеров', value: data.managers.length, sub: 'в анализе', color: [255,170,0] },
    ];
    const kw = (CW - 9) / 4;
    kpis.forEach((k, i) => {
      const x = M + i*(kw+3);
      doc.setFillColor(245,247,252);
      doc.roundedRect(x, y, kw, 22, 2, 2, 'F');
      doc.setDrawColor(...k.color); doc.setLineWidth(0.8);
      doc.line(x+2, y+2, x+2, y+20);
      doc.setTextColor(100,100,120); doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
      doc.text(k.label.toUpperCase(), x+6, y+7);
      doc.setTextColor(...k.color); doc.setFont('helvetica','bold'); doc.setFontSize(16);
      doc.text(String(k.value), x+6, y+15);
      doc.setTextColor(150,150,170); doc.setFont('helvetica','normal'); doc.setFontSize(7);
      doc.text(k.sub, x+6, y+20);
    });
    y += 30;

    // ── ЗВОНКИ ────────────────────────────────────────────────────────────────
    doc.setTextColor(30,58,95); doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.text('1. Анализ звонков', M, y); y += 8;

    // Статистика звонков
    const callPct = data.calls.total ? Math.round(data.calls.analyzed/data.calls.total*100) : 0;
    doc.setFillColor(255,245,240);
    doc.roundedRect(M, y, CW, 18, 2, 2, 'F');
    doc.setTextColor(80,80,100); doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.text(`Всего записей: ${data.calls.total}`, M+5, y+7);
    doc.text(`Транскрибировано: ${data.calls.analyzed}`, M+55, y+7);
    doc.text(`Охват анализа: ${callPct}%`, M+115, y+7);
    // progress bar
    doc.setFillColor(220,220,230); doc.roundedRect(M+5, y+11, CW-10, 4, 1, 1, 'F');
    if (callPct > 0) {
      doc.setFillColor(255,107,53);
      doc.roundedRect(M+5, y+11, (CW-10)*callPct/100, 4, 1, 1, 'F');
    }
    y += 24;

    // ── ПЕРЕПИСКИ ─────────────────────────────────────────────────────────────
    checkY(30);
    doc.setTextColor(30,58,95); doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.text('2. Анализ переписок WhatsApp', M, y); y += 8;

    const convPct = data.conversations.total ? Math.round(data.conversations.analyzed/data.conversations.total*100) : 0;
    doc.setFillColor(240,245,255);
    doc.roundedRect(M, y, CW, 18, 2, 2, 'F');
    doc.setTextColor(80,80,100); doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.text(`Всего переписок: ${data.conversations.total}`, M+5, y+7);
    doc.text(`Проанализировано: ${data.conversations.analyzed}`, M+65, y+7);
    doc.text(`Охват: ${convPct}%`, M+135, y+7);
    doc.setFillColor(220,220,230); doc.roundedRect(M+5, y+11, CW-10, 4, 1, 1, 'F');
    if (convPct > 0) {
      doc.setFillColor(108,99,255);
      doc.roundedRect(M+5, y+11, (CW-10)*convPct/100, 4, 1, 1, 'F');
    }
    y += 28;

    // ── ТАБЛИЦА МЕНЕДЖЕРОВ ────────────────────────────────────────────────────
    if (data.managers.length > 0) {
      checkY(20);
      doc.setTextColor(30,58,95); doc.setFont('helvetica','bold'); doc.setFontSize(13);
      doc.text('3. Рейтинг менеджеров', M, y); y += 8;

      // Заголовок таблицы
      const cols = [
        { label: '#', w: 8 },
        { label: 'Менеджер', w: 30 },
        { label: 'Рейтинг', w: 18 },
        { label: 'Звонки', w: 16 },
        { label: 'Перепис.', w: 18 },
        { label: 'Продал', w: 16 },
        { label: 'Не прод.', w: 18 },
        { label: 'Конверс.', w: 18 },
        { label: 'Топ ошибка', w: 38 },
      ];
      const rowH = 8;

      doc.setFillColor(30,58,95);
      doc.rect(M, y, CW, rowH, 'F');
      doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
      let cx = M+1;
      cols.forEach(c => { doc.text(c.label, cx, y+5.5); cx += c.w; });
      y += rowH;

      data.managers.forEach((m, i) => {
        checkY(rowH+2);
        const all = m.results.sold + m.results.lost + m.results.pending;
        const conv = all ? Math.round(m.results.sold/all*100) : 0;
        const sc = m.avgScore;

        doc.setFillColor(i%2===0 ? 248 : 255, i%2===0 ? 249 : 255, i%2===0 ? 252 : 255);
        doc.rect(M, y, CW, rowH, 'F');
        doc.setDrawColor(220,220,230); doc.setLineWidth(0.2);
        doc.line(M, y+rowH, M+CW, y+rowH);

        // Score color
        const sColor = sc >= 7 ? [0,150,100] : sc >= 5 ? [176,112,0] : [180,0,0];

        doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
        cx = M+1;
        doc.setTextColor(100,100,120); doc.text(String(i+1), cx, y+5.5); cx += cols[0].w;
        doc.setTextColor(30,30,50); doc.setFont('helvetica','bold');
        doc.text(m.name.slice(0,16), cx, y+5.5); cx += cols[1].w;
        doc.setTextColor(...sColor);
        doc.text(`${sc}/10`, cx, y+5.5); cx += cols[2].w;
        doc.setTextColor(60,60,90); doc.setFont('helvetica','normal');
        doc.text(String(m.calls), cx, y+5.5); cx += cols[3].w;
        doc.text(String(m.convs), cx, y+5.5); cx += cols[4].w;
        doc.setTextColor(0,140,80);
        doc.text(String(m.results.sold), cx, y+5.5); cx += cols[5].w;
        doc.setTextColor(180,0,0);
        doc.text(String(m.results.lost), cx, y+5.5); cx += cols[6].w;
        doc.setTextColor(108,99,255); doc.setFont('helvetica','bold');
        doc.text(`${conv}%`, cx, y+5.5); cx += cols[7].w;
        doc.setTextColor(60,60,90); doc.setFont('helvetica','normal'); doc.setFontSize(6.5);
        doc.text((m.topErrors[0]||'—').slice(0,30), cx, y+5.5);
        y += rowH;
      });
      y += 10;
    }

    // ── ДЕТАЛИ ПО КАЖДОМУ МЕНЕДЖЕРУ ──────────────────────────────────────────
    if (data.managers.length > 0) {
      checkY(20);
      doc.setTextColor(30,58,95); doc.setFont('helvetica','bold'); doc.setFontSize(13);
      doc.text('4. Детальный профиль менеджеров', M, y); y += 10;

      data.managers.forEach((m) => {
        checkY(40);
        const all = m.results.sold + m.results.lost + m.results.pending;
        const conv = all ? Math.round(m.results.sold/all*100) : 0;
        const sc = m.avgScore;
        const sColor = sc >= 7 ? [0,150,100] : sc >= 5 ? [176,112,0] : [180,0,0];

        // Имя менеджера
        doc.setFillColor(...sColor.map(c=>Math.min(255,c+180)));
        doc.roundedRect(M, y, CW, 9, 1.5, 1.5, 'F');
        doc.setFillColor(...sColor); doc.rect(M, y, 3, 9, 'F');
        doc.setTextColor(30,30,50); doc.setFont('helvetica','bold'); doc.setFontSize(10);
        doc.text(m.name, M+7, y+6);
        doc.setTextColor(...sColor);
        doc.text(`${sc}/10`, M+60, y+6);
        doc.setTextColor(80,80,100); doc.setFont('helvetica','normal'); doc.setFontSize(8);
        doc.text(`Конверсия: ${conv}% | Звонки: ${m.calls} | Переписок: ${m.convs}`, M+80, y+6);
        y += 12;

        // Ошибки
        if (m.topErrors.length) {
          doc.setTextColor(180,0,0); doc.setFont('helvetica','bold'); doc.setFontSize(8);
          doc.text('Типичные ошибки:', M+3, y); y += 5;
          m.topErrors.forEach(e => {
            checkY(6);
            doc.setTextColor(80,40,40); doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
            const lines = doc.splitTextToSize(`• ${e}`, CW-8);
            doc.text(lines, M+6, y);
            y += lines.length * 4.5;
          });
        }

        // Сильные стороны
        if (m.topStrengths.length) {
          checkY(10);
          doc.setTextColor(0,120,70); doc.setFont('helvetica','bold'); doc.setFontSize(8);
          doc.text('Сильные стороны:', M+3, y); y += 5;
          m.topStrengths.forEach(s => {
            checkY(6);
            doc.setTextColor(30,70,40); doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
            doc.text(`+ ${s}`, M+6, y); y += 5;
          });
        }
        y += 6;
      });
    }

    // ── ФУТЕР ────────────────────────────────────────────────────────────────
    const pageCount = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pageCount; i++) {
      doc.setPage(i);
      doc.setDrawColor(200,200,215); doc.setLineWidth(0.3);
      doc.line(M, 287, W-M, 287);
      doc.setTextColor(150,150,170); doc.setFont('helvetica','normal'); doc.setFontSize(7);
      doc.text(`Invictus GO · AI-аудит отдела продаж · ${data.generatedAt}`, M, 292);
      doc.text(`${i} / ${pageCount}`, W-M, 292, { align: 'right' });
    }

    const filename = `invictus_audit_${dateFrom}${dateFrom!==dateTo?'_'+dateTo:''}.pdf`;
    doc.save(filename);
    showAlert(`✅ PDF сохранён: ${filename}`, 'success');

  } catch(e) {
    showAlert('Ошибка генерации PDF: ' + e.message, 'warning');
  } finally {
    btn.disabled = false; btn.textContent = '📄 Скачать PDF отчёт';
  }
}
</script>
